name = "loopmaatje"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

# Create the namespace once with: npx wrangler kv namespace create LOOPMAATJE
# and paste its id below (or bind it in the Cloudflare dashboard: Pages > loopmaatje > Settings > Bindings).
[[kv_namespaces]]
binding = "LOOPMAATJE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
